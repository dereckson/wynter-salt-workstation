<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!--
    Fixedsys Excelsior, with Symbols Nerd Font as fallback for the
    glyphs it lacks.

    Symbols Nerd Font Mono is cell-aligned for terminals; the
    proportional family covers the same codepoints if Mono is missing.
-->

<fontconfig>

  <match target="pattern">
    <test name="family">
      <string>Fixedsys Excelsior</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Symbols Nerd Font Mono</string>
      <string>Symbols Nerd Font</string>
    </edit>
  </match>

</fontconfig>
