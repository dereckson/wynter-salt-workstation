<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!--
    Fixedsys Excelsior, with Cozette as fallback for the glyphs it lacks,
    like the Nerd Fonts symbols.

    Cozette is a bitmap font: distributions rejecting bitmap fonts need it
    to be explicitly accepted. CozetteVector is the vector flavour, used
    when the bitmap one can't be (applications without bitmap support).
-->

<fontconfig>

  <selectfont>
    <acceptfont>
      <pattern>
        <patelt name="family">
          <string>Cozette</string>
        </patelt>
      </pattern>
    </acceptfont>
  </selectfont>

  <match target="pattern">
    <test name="family">
      <string>Fixedsys Excelsior</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Cozette</string>
      <string>CozetteVector</string>
    </edit>
  </match>

</fontconfig>
